<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheckoutPulse AI Pro - Complete Subscription</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    body {
      background-color: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #10b981;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Opening Secure Checkout...</h2>
  <p>Please complete your subscription in the checkout window.</p>

  <script>
    // Initialize Paddle Billing with your Client-Side Token
    // Replace YOUR_PADDLE_CLIENT_TOKEN with the token from Step 1
    Paddle.Initialize({ 
      token: "live_88bcb1fc5b40206eb669bb596c5"
    });

    // Extract price_id from the URL string
    const urlParams = new URLSearchParams(window.location.search);
    const priceId = urlParams.get('price_id');

    if (priceId) {
      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }]
      });
    } else {
      document.body.innerHTML = "<h2>Invalid Request</h2><p>No pricing plan selected.</p>";
    }
  </script>
</body>
</html>
